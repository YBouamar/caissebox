# Production CaisseBox sur un VPS Contabo (Ubuntu 24.04 + Docker).
# Lancement : cd infra && cp .env.example .env && (éditer) && docker compose up -d --build
name: caissebox

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: caissebox
      POSTGRES_USER: caissebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caissebox -d caissebox"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Aucun port publié : la base n'est joignable que depuis le réseau Docker.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://caissebox:${POSTGRES_PASSWORD}@postgres:5432/caissebox
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      PORT: 3000
      CORS_ORIGIN: https://${BACKOFFICE_DOMAIN},https://${CONSOLE_DOMAIN}

  # Back-office des clients et console BACYBRAINS (même application, aiguillage par compte).
  # Il appelle l'API par le réseau Docker interne : aucun appel du navigateur vers l'API.
  backoffice:
    build:
      context: ..
      dockerfile: apps/backoffice/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:3000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, backoffice]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      BACKOFFICE_DOMAIN: ${BACKOFFICE_DOMAIN}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Sauvegarde quotidienne de la base (7 jours glissants + 4 semaines).
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: caissebox
      POSTGRES_USER: caissebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "0 4 * * *"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - ./backups:/backups

  # Headwind MDM Community s'installe à part (voir docs/architecture.md), sur mdm.<domaine>.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
